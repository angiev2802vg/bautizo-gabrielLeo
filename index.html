<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Bautizo - Gabriel Leonardo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #eaf0e6;
            background-image: radial-gradient(#556B2F 0.5px, transparent 0.5px), radial-gradient(#3B4D20 0.5px, #eaf0e6 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Envoltorio del sobre horizontal */
        .envelope-wrapper {
            position: relative;
            width: 340px;
            height: 240px;
            cursor: pointer;
            perspective: 1000px;
            margin-top: 150px;
        }

        /* Cuerpo del sobre en Color Verde Olivo */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #556B2F;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.22);
            border: 1px solid #3B4D20;
            z-index: 1;
        }

        /* Solapa Superior en un tono verde olivo un poco más claro para dar profundidad */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 135px solid #637D37;
            transform-origin: top;
            transition: transform 0.6s ease-in-out, z-index 0.2s ease-in-out;
            z-index: 4;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15));
        }

        /* Bolsillo inferior del sobre en verde olivo */
        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid #556B2F;
            border-right: 170px solid #556B2F;
            border-bottom: 145px solid #4A5F28;
            z-index: 3;
            border-radius: 0 0 8px 8px;
        }

        /* Botón de toque dorado */
        .stamp {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: #C5A059;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: opacity 0.4s ease;
            white-space: nowrap;
            border: 1px solid #E6D5B8;
        }

        /* La Tarjeta (Escondida dentro al inicio) */
        .card {
            position: absolute;
            top: 10px;
            left: 4%;
            width: 92%;
            height: 90%;
            background: #ffffff;
            border-radius: 6px;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            overflow: hidden;
            border: 1px solid #E6D5B8;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Enlaces invisibles para Google Maps sobre la imagen */
        .map-link-iglesia {
            position: absolute;
            bottom: 6%;
            left: 5%;
            width: 42%;
            height: 20%;
            z-index: 10;
        }

        .map-link-recepcion {
            position: absolute;
            bottom: 6%;
            right: 5%;
            width: 42%;
            height: 20%;
            z-index: 10;
        }

        /* ANIMACIÓN AL ABRIR */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .stamp {
            opacity: 0;
            pointer-events: none;
        }

        /* La tarjeta sube por completo afuera del sobre olivo y se agranda */
        .envelope-wrapper.open .card {
            transform: translateY(-290px) scale(1.45);
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0,0,0,0.35);
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="stamp">Toca para abrir</div>
        <div class="flap"></div>
        <div class="envelope"></div>
        <div class="pocket"></div>
        
        <div class="card">
            <!-- Imagen de la invitación -->
            <img src="invitacion.png" alt="Invitación Bautizo" class="card-img">

            <!-- Enlaces directos a Google Maps sobre la imagen -->
            <a href="https://maps.app.goo.gl/4puismLnPvUiKFsf6" target="_blank" class="map-link-iglesia"></a>
            <a href="https://maps.app.goo.gl/R7EmX4a9f7hC3Ujs9" target="_blank" class="map-link-recepcion"></a>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('envelopeWrapper');
        wrapper.addEventListener('click', (e) => {
            if (e.target.tagName !== 'A') {
                wrapper.classList.toggle('open');
            }
        });
    </script>

</body>
</html>
