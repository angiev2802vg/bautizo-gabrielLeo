<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Bautizo - Gabriel Leonardo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #eaf0e6;
            background-image: radial-gradient(#556B2F 0.5px, transparent 0.5px), radial-gradient(#3B4D20 0.5px, #eaf0e6 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .envelope-wrapper {
            position: relative;
            width: 350px;
            height: 500px;
            cursor: pointer;
            perspective: 1000px;
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 1px solid rgba(197, 160, 89, 0.4);
            overflow: hidden;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 175px solid transparent;
            border-right: 175px solid transparent;
            border-top: 190px solid #f2f5f0;
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
            z-index: 4;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
        }

        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 175px solid #ffffff;
            border-right: 175px solid #ffffff;
            border-bottom: 250px solid #f8faf7;
            z-index: 3;
            border-radius: 0 0 8px 8px;
        }

        .stamp {
            position: absolute;
            top: 145px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: #C5A059;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: opacity 0.4s ease;
        }

        .card {
            position: absolute;
            bottom: 10px;
            left: 3%;
            width: 94%;
            height: 96%;
            background: #ffffff;
            border-radius: 6px;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Zonas interactivas invisibles para la ubicación exacta */
        .map-link-iglesia {
            position: absolute;
            bottom: 6%;
            left: 5%;
            width: 42%;
            height: 20%;
            z-index: 10;
        }

        .map-link-recepcion {
            position: absolute;
            bottom: 6%;
            right: 5%;
            width: 42%;
            height: 20%;
            z-index: 10;
        }

        /* Animación de apertura y rebote */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .stamp {
            opacity: 0;
            pointer-events: none;
        }

        .envelope-wrapper.open .card {
            transform: translateY(-135px) scale(1.04);
            z-index: 5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="stamp">Toca para abrir</div>
        <div class="flap"></div>
        <div class="envelope"></div>
        <div class="pocket"></div>
        
        <div class="card">
            <!-- Carga la imagen PNG de la invitación -->
            <img src="invitacion.png" alt="Invitación Bautizo" class="card-img">

            <!-- Enlaces directos a Google Maps sobre la imagen -->
            <a href="https://maps.app.goo.gl/4puismLnPvUiKFsf6" target="_blank" class="map-link-iglesia"></a>
            <a href="https://maps.app.goo.gl/R7EmX4a9f7hC3Ujs9" target="_blank" class="map-link-recepcion"></a>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('envelopeWrapper');
        wrapper.addEventListener('click', (e) => {
            if (e.target.tagName !== 'A') {
                wrapper.classList.toggle('open');
            }
        });
    </script>

</body>
</html>
